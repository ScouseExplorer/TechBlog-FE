name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out your repository code onto the runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up your environment (e.g., Node.js, Python, Java)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Step 3: Install dependencies and run tests
      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Step 4: Build the project
      - name: Build project
        run: npm run build

      # Step 5: Lint the project
      - name: Lint project
        run: npm run lint
        